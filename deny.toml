[advisories]
version = 2
ignore = [
    # chrono is flagged unmaintained (informational, not a vulnerability). It is
    # pulled in transitively by zxcvbn 3.1.1 (latest) and has no safe upgrade.
    # Revisit once zxcvbn drops chrono or a replacement estimator is adopted.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained transitive dep of zxcvbn; no upgrade path" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "LGPL-2.1-or-later",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
